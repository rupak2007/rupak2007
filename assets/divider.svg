<svg xmlns="http://www.w3.org/2000/svg" width="840" height="100" viewBox="0 0 840 100" role="img" aria-label="divider">
<style>
.mv{animation:mv 81.81s linear infinite}
@keyframes mv{0%{transform:translate(-37px,0px)}96.480%{transform:translate(840px,0px)}100%{transform:translate(840px,0px)}}
.w{visibility:hidden;image-rendering:pixelated;animation:wk 0.72s steps(1,end) infinite}
@keyframes wk{0%{visibility:visible}25%{visibility:hidden}100%{visibility:hidden}}
</style>
<rect x="0" y="96" width="840" height="1" fill="#484f58"/>
<g class="mv"><image class="w" y="6" style="animation-delay:-0.72s" width="37" height="92" href="data:image/png;base64,"/><image class="w" y="6" style="animation-delay:-0.54s" width="37" height="92" href="data:image/png;base64,"/><image class="w" y="6" style="animation-delay:-0.36s" width="37" height="92" href="data:image/png;base64,"/><image class="w" y="6" style="animation-delay:-0.18s" width="37" height="92" href="data:image/png;base64,"/></g>
</svg>
